<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursor Memory Viewer</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("cursor-memory-theme");
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        --font-sans:
          "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont,
          sans-serif;
        --font-mono:
          "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas,
          "Liberation Mono", monospace;
        --sidebar-width: 318px;
        --header-height: 72px;
        --content-max-width: 1040px;
        --radius-sm: 10px;
        --radius-md: 16px;
        --radius-lg: 22px;
        --shadow-soft: 0 14px 40px rgba(15, 23, 42, 0.08);
        --shadow-card: 0 18px 50px rgba(15, 23, 42, 0.12);
        --transition-speed: 0.22s;

        --type-decision: #3b82f6;
        --type-insight: #22c55e;
        --type-confidence: #8b5cf6;
        --type-pattern_seed: #f59e0b;
        --type-commitment: #ec4899;
        --type-learning: #10b981;
        --type-correction: #ef4444;
        --type-cross_agent: #6366f1;
        --type-workflow_note: #64748b;
        --type-gap: #f97316;

        --conf-low: #f59e0b;
        --conf-mid: #3b82f6;
        --conf-high: #22c55e;
      }

      @media (prefers-reduced-motion: reduce) {
        :root {
          --transition-speed: 0s;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }

      :root {
        color-scheme: light;
        --bg-primary: #f3f6fb;
        --bg-secondary: rgba(255, 255, 255, 0.82);
        --bg-tertiary: #ffffff;
        --bg-elevated: rgba(255, 255, 255, 0.92);
        --bg-card: rgba(255, 255, 255, 0.94);
        --bg-card-strong: #ffffff;
        --bg-sidebar: rgba(248, 250, 252, 0.9);
        --bg-hover: rgba(37, 99, 235, 0.08);
        --bg-selected: rgba(37, 99, 235, 0.14);
        --bg-contrast: rgba(148, 163, 184, 0.14);
        --text-primary: #0f172a;
        --text-secondary: #334155;
        --text-muted: #64748b;
        --text-soft: #94a3b8;
        --accent: #2563eb;
        --accent-strong: #1d4ed8;
        --accent-dim: #3b82f6;
        --accent-contrast: #eff6ff;
        --json-string: #166534;
        --json-number: #1d4ed8;
        --json-boolean: #b45309;
        --json-null: #64748b;
        --border: rgba(148, 163, 184, 0.28);
        --border-strong: rgba(100, 116, 139, 0.26);
        --line-soft: rgba(148, 163, 184, 0.18);
        --shadow-soft: 0 14px 36px rgba(15, 23, 42, 0.08);
        --shadow-card: 0 22px 46px rgba(15, 23, 42, 0.08);
        --page-glow:
          radial-gradient(
            circle at top left,
            rgba(37, 99, 235, 0.15),
            transparent 34%
          ),
          radial-gradient(
            circle at top right,
            rgba(14, 165, 233, 0.12),
            transparent 28%
          ),
          linear-gradient(180deg, #f8fbff 0%, #eef3f9 100%);
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --bg-primary: #020617;
        --bg-secondary: rgba(15, 23, 42, 0.78);
        --bg-tertiary: #0f172a;
        --bg-elevated: rgba(15, 23, 42, 0.92);
        --bg-card: rgba(15, 23, 42, 0.88);
        --bg-card-strong: #111c31;
        --bg-sidebar: rgba(9, 14, 26, 0.86);
        --bg-hover: rgba(96, 165, 250, 0.14);
        --bg-selected: rgba(37, 99, 235, 0.2);
        --bg-contrast: rgba(51, 65, 85, 0.45);
        --text-primary: #e2e8f0;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --text-soft: #64748b;
        --accent: #38bdf8;
        --accent-strong: #7dd3fc;
        --accent-dim: #0ea5e9;
        --accent-contrast: rgba(56, 189, 248, 0.14);
        --json-string: #86efac;
        --json-number: #93c5fd;
        --json-boolean: #fdba74;
        --json-null: #94a3b8;
        --border: rgba(71, 85, 105, 0.48);
        --border-strong: rgba(100, 116, 139, 0.52);
        --line-soft: rgba(100, 116, 139, 0.22);
        --shadow-soft: 0 16px 40px rgba(2, 6, 23, 0.42);
        --shadow-card: 0 26px 52px rgba(2, 6, 23, 0.5);
        --page-glow:
          radial-gradient(
            circle at top left,
            rgba(56, 189, 248, 0.12),
            transparent 30%
          ),
          radial-gradient(
            circle at top right,
            rgba(34, 197, 94, 0.1),
            transparent 24%
          ),
          linear-gradient(180deg, #020617 0%, #07101f 100%);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg-primary: #020617;
          --bg-secondary: rgba(15, 23, 42, 0.78);
          --bg-tertiary: #0f172a;
          --bg-elevated: rgba(15, 23, 42, 0.92);
          --bg-card: rgba(15, 23, 42, 0.88);
          --bg-card-strong: #111c31;
          --bg-sidebar: rgba(9, 14, 26, 0.86);
          --bg-hover: rgba(96, 165, 250, 0.14);
          --bg-selected: rgba(37, 99, 235, 0.2);
          --bg-contrast: rgba(51, 65, 85, 0.45);
          --text-primary: #e2e8f0;
          --text-secondary: #cbd5e1;
          --text-muted: #94a3b8;
          --text-soft: #64748b;
          --accent: #38bdf8;
          --accent-strong: #7dd3fc;
          --accent-dim: #0ea5e9;
          --accent-contrast: rgba(56, 189, 248, 0.14);
          --json-string: #86efac;
          --json-number: #93c5fd;
          --json-boolean: #fdba74;
          --json-null: #94a3b8;
          --border: rgba(71, 85, 105, 0.48);
          --border-strong: rgba(100, 116, 139, 0.52);
          --line-soft: rgba(100, 116, 139, 0.22);
          --shadow-soft: 0 16px 40px rgba(2, 6, 23, 0.42);
          --shadow-card: 0 26px 52px rgba(2, 6, 23, 0.5);
          --page-glow:
            radial-gradient(
              circle at top left,
              rgba(56, 189, 248, 0.12),
              transparent 30%
            ),
            radial-gradient(
              circle at top right,
              rgba(34, 197, 94, 0.1),
              transparent 24%
            ),
            linear-gradient(180deg, #020617 0%, #07101f 100%);
        }
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --bg-primary: #020617;
        --bg-secondary: rgba(15, 23, 42, 0.78);
        --bg-tertiary: #0f172a;
        --bg-elevated: rgba(15, 23, 42, 0.92);
        --bg-card: rgba(15, 23, 42, 0.88);
        --bg-card-strong: #111c31;
        --bg-sidebar: rgba(9, 14, 26, 0.86);
        --bg-hover: rgba(96, 165, 250, 0.14);
        --bg-selected: rgba(37, 99, 235, 0.2);
        --bg-contrast: rgba(51, 65, 85, 0.45);
        --text-primary: #e2e8f0;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --text-soft: #64748b;
        --accent: #38bdf8;
        --accent-strong: #7dd3fc;
        --accent-dim: #0ea5e9;
        --accent-contrast: rgba(56, 189, 248, 0.14);
        --border: rgba(71, 85, 105, 0.48);
        --border-strong: rgba(100, 116, 139, 0.52);
        --line-soft: rgba(100, 116, 139, 0.22);
        --shadow-soft: 0 16px 40px rgba(2, 6, 23, 0.42);
        --shadow-card: 0 26px 52px rgba(2, 6, 23, 0.5);
        --page-glow:
          radial-gradient(
            circle at top left,
            rgba(56, 189, 248, 0.12),
            transparent 30%
          ),
          radial-gradient(
            circle at top right,
            rgba(34, 197, 94, 0.1),
            transparent 24%
          ),
          linear-gradient(180deg, #020617 0%, #07101f 100%);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: var(--font-sans);
        background: var(--page-glow), var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        overflow: hidden;
      }

      button,
      input {
        font: inherit;
      }

      button {
        appearance: none;
        -webkit-appearance: none;
      }

      button:focus-visible,
      input:focus-visible,
      .tree-project-header:focus-visible,
      .tree-group-label:focus-visible,
      .tree-file:focus-visible,
      .search-hit:focus-visible,
      .source-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      ::selection {
        background: var(--accent-contrast);
        color: var(--accent-strong);
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-height: 100vh;
        overflow: hidden;
      }

      .header {
        min-height: var(--header-height);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 18px;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        flex-shrink: 0;
      }

      .header-brand {
        min-width: 0;
      }

      .header-title {
        display: block;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: var(--text-primary);
        white-space: nowrap;
      }

      .header-subtitle {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .header-search {
        flex: 1;
        max-width: 460px;
        position: relative;
      }

      .header-search input {
        width: 100%;
        min-height: 42px;
        padding: 10px 14px 10px 42px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        color: var(--text-primary);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        transition:
          border-color var(--transition-speed),
          box-shadow var(--transition-speed),
          background var(--transition-speed);
      }

      .header-search input::placeholder {
        color: var(--text-muted);
      }

      .header-search input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-contrast);
      }

      .header-search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }

      .header-actions {
        display: flex;
        gap: 10px;
        margin-left: auto;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        color: var(--text-secondary);
        cursor: pointer;
        transition:
          transform var(--transition-speed),
          border-color var(--transition-speed),
          background var(--transition-speed),
          color var(--transition-speed),
          box-shadow var(--transition-speed);
      }

      .btn:hover {
        color: var(--text-primary);
        border-color: var(--accent-dim);
        background: var(--bg-card-strong);
        box-shadow: var(--shadow-soft);
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn-theme {
        display: inline-flex;
        align-items: center;
        min-width: 134px;
        justify-content: flex-start;
      }

      .btn-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        line-height: 0;
      }

      .btn-icon svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .btn-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.01em;
      }

      .main {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .sidebar {
        width: var(--sidebar-width);
        min-width: var(--sidebar-width);
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        scroll-behavior: smooth;
        padding: 14px 10px 18px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .tree-empty,
      .content-loading,
      .search-empty {
        color: var(--text-muted);
        font-size: 13px;
      }

      .tree-empty {
        padding: 28px 16px;
        text-align: center;
        line-height: 1.8;
      }

      .tree-project {
        margin-bottom: 8px;
      }

      .tree-project-header,
      .tree-group-label,
      .tree-file,
      .search-hit,
      .source-toggle {
        cursor: pointer;
      }

      .tree-project-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 14px;
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 700;
        transition:
          background var(--transition-speed),
          color var(--transition-speed);
        user-select: none;
      }

      .tree-project-header:hover {
        background: var(--bg-hover);
      }

      .tree-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        font-size: 12px;
        color: var(--text-muted);
        transition: transform var(--transition-speed);
        flex-shrink: 0;
      }

      .tree-arrow.open {
        transform: rotate(90deg);
      }

      .tree-project-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tree-children,
      .tree-group-children {
        overflow: hidden;
        max-height: 0;
        opacity: 0;
        transition:
          max-height var(--transition-speed) ease,
          opacity var(--transition-speed) ease;
      }

      .tree-children.open,
      .tree-group-children.open {
        max-height: 9999px;
        opacity: 1;
      }

      .tree-section {
        padding: 10px 12px 6px 30px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-soft);
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .tree-group-label {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 12px 6px 30px;
        border-radius: 12px;
        font-size: 12px;
        color: var(--text-secondary);
        user-select: none;
        transition:
          background var(--transition-speed),
          color var(--transition-speed);
      }

      .tree-group-label:hover {
        color: var(--text-primary);
        background: var(--bg-hover);
      }

      .tree-group-label .tree-arrow {
        width: 12px;
        font-size: 12px;
      }

      .tree-file {
        padding: 7px 12px 7px 48px;
        border-radius: 12px;
        font-size: 12px;
        color: var(--text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition:
          background var(--transition-speed),
          color var(--transition-speed),
          transform var(--transition-speed);
      }

      .tree-file:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
        transform: translateX(2px);
      }

      .tree-file.active {
        background: var(--bg-selected);
        color: var(--accent-strong);
        font-weight: 600;
      }

      .content {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        padding: 28px 28px 40px;
        scroll-behavior: smooth;
      }

      .content > * {
        width: min(100%, var(--content-max-width));
        margin-inline: auto;
      }

      .content-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
      }

      .empty-state {
        width: min(100%, 720px);
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--bg-card);
        box-shadow: var(--shadow-card);
      }

      .empty-state-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--accent-contrast);
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .empty-state-title {
        margin-top: 16px;
        font-size: clamp(24px, 4vw, 34px);
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      .empty-state-text {
        margin-top: 12px;
        max-width: 56ch;
        font-size: 15px;
        color: var(--text-secondary);
      }

      .empty-state-tips {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      .empty-state-tip {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        color: var(--text-muted);
        font-size: 12px;
      }

      .content-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 280px;
        gap: 12px;
      }

      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .session-header,
      .aggregate-header {
        margin-bottom: 20px;
        padding: 20px 22px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: linear-gradient(
          180deg,
          var(--bg-card) 0%,
          var(--bg-card-strong) 100%
        );
        box-shadow: var(--shadow-soft);
      }

      .document-header-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .document-header-main {
        min-width: 0;
        flex: 1;
      }

      .document-header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .session-id {
        font-size: clamp(20px, 3vw, 28px);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        word-break: break-word;
      }

      .session-meta {
        margin-top: 10px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        color: var(--text-muted);
        font-size: 12px;
      }

      .session-meta span,
      .aggregate-stats .stat-card-label {
        font-family: var(--font-mono);
      }

      .meta-chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--line-soft);
        background: var(--bg-elevated);
      }

      .btn-inline {
        min-height: 34px;
        padding: 0 12px;
        font-size: 12px;
        font-weight: 600;
      }

      .btn-copy.copied {
        color: var(--accent-strong);
        border-color: var(--accent-dim);
        background: var(--accent-contrast);
      }

      .aggregate-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .raw-json-section {
        margin-bottom: 18px;
        padding: 18px 20px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: linear-gradient(
          180deg,
          var(--bg-card) 0%,
          var(--bg-card-strong) 100%
        );
        box-shadow: var(--shadow-soft);
      }

      .raw-json-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .raw-json-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .raw-json-subtitle {
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.6;
        color: var(--text-muted);
      }

      .raw-json-chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--line-soft);
        background: var(--bg-elevated);
        color: var(--text-secondary);
        font-family: var(--font-mono);
        font-size: 11px;
        flex-shrink: 0;
      }

      .json-tree {
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line-soft);
        background: var(--bg-elevated);
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.6;
      }

      .json-node,
      .json-leaf {
        margin-left: calc(var(--json-depth, 0) * 18px);
      }

      .json-node-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 28px;
        padding: 4px 6px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        color: var(--text-secondary);
        text-align: left;
      }

      .json-node-toggle:hover {
        border-color: var(--line-soft);

    </div>

    <script type="module">
      import {
        SHARE_QUERY_PARAM,
        buildTreeIndexes as buildPermalinkIndexes,
        buildShareUrl as buildPermalinkUrl,
        getShareKeyFromHref,
        getTreeEntryByFileId as getIndexedTreeEntryByFileId,
        getTreeEntryByShareKey as getIndexedTreeEntryByShareKey,
        resolveSharedEntry,
      } from "/assets/serve-permalink.mjs";

      /* ============================================================
   State
   ============================================================ */
      const state = {
        tree: null,
        activeFileId: null,
        activeShareKey: null,
        fileIndexById: new Map(),
        fileIndexByShareKey: new Map(),
        searchMode: false,
        searchAbort: null,
        activeRequestToken: 0,
        shareFeedbackTimer: null,
        theme: null,
      };

      const THEME_STORAGE_KEY = "cursor-memory-theme";
      const THEME_ICONS = {
        light: `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="4" stroke-width="2"></circle>
            <path d="M12 2v2.5M12 19.5V22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M2 12h2.5M19.5 12H22M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        `,
        dark: `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        `,
      };

      /* ============================================================
   API helpers
   ============================================================ */
      async function apiGet(url) {
        const res = await fetch(url);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || `HTTP ${res.status}`);
        }
        return res.json();
      }

      async function apiPost(url) {
        const res = await fetch(url, { method: "POST" });
        return res.json();
      }

      /* ============================================================
   Utility: safe text
   ============================================================ */
      function txt(parent, text) {
        parent.appendChild(document.createTextNode(text));
      }

      function el(tag, className, textContent) {
        const e = document.createElement(tag);
        if (className) e.className = className;
        if (textContent !== undefined) txt(e, textContent);
        return e;
      }

      function setInteractiveEnabled(element, enabled) {
        element.tabIndex = enabled ? 0 : -1;
      }

      function makeInteractive(element, handler, options = {}) {
        setInteractiveEnabled(element, options.enabled !== false);
        element.setAttribute("role", "button");
        element.addEventListener("click", handler);
        element.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            handler();
          }
        });
      }

      function setExpandedState(element, isExpanded) {
        element.setAttribute("aria-expanded", isExpanded ? "true" : "false");
      }

      function syncGroupChildrenInteractivity(childrenEl, isOpen) {
        for (const child of childrenEl.children) {
          if (child.classList.contains("tree-file")) {
            setInteractiveEnabled(child, isOpen);
          }
        }
      }

      function syncProjectChildrenInteractivity(childrenEl, isOpen) {
        for (const child of childrenEl.children) {
          if (
            child.classList.contains("tree-group-label") ||
            child.classList.contains("tree-file")
          ) {
            setInteractiveEnabled(child, isOpen);
            continue;
          }
          if (child.classList.contains("tree-group-children")) {
            syncGroupChildrenInteractivity(
              child,
              isOpen && child.classList.contains("open"),
            );
          }
        }
      }

      function formatNumber(value) {
        const numeric =
          typeof value === "number"
            ? value
            : typeof value === "string" && value.trim() !== ""
              ? Number(value)
              : NaN;
        if (Number.isFinite(numeric)) {
          return new Intl.NumberFormat("en-US").format(numeric);
        }
        return String(value);
      }

      function formatJsonSummary(value) {
        if (Array.isArray(value)) {
          return `[${formatNumber(value.length)} item${value.length === 1 ? "" : "s"}]`;
        }
        const size = Object.keys(value || {}).length;
        return `{${formatNumber(size)} key${size === 1 ? "" : "s"}}`;
      }

      function isJsonContainer(value) {
        return value !== null && typeof value === "object";
      }

      function createJsonValueNode(value) {
        const span = el("span", "json-value");
        if (typeof value === "string") {
          span.classList.add("json-value-string");
          txt(span, JSON.stringify(value));
          return span;
        }
        if (typeof value === "number") {
          span.classList.add("json-value-number");
          txt(span, String(value));
          return span;
        }
        if (typeof value === "boolean") {
          span.classList.add("json-value-boolean");
          txt(span, value ? "true" : "false");
          return span;
        }
        if (value === null) {
          span.classList.add("json-value-null");
          txt(span, "null");
          return span;
        }
        txt(span, JSON.stringify(value));
        return span;
      }

      function createJsonLeaf(key, value, depth) {
        const row = el("div", "json-leaf");
        row.style.setProperty("--json-depth", depth);
        const label = el("div", "json-leaf-label");
        label.appendChild(el("span", "json-node-key", key));
        label.appendChild(el("span", "json-node-colon", ":"));
        label.appendChild(createJsonValueNode(value));
        row.appendChild(label);
        return row;
      }

      function createJsonNode(key, value, depth, { expanded = false } = {}) {
        if (!isJsonContainer(value)) {
          return createJsonLeaf(key, value, depth);
        }

        const entries = Array.isArray(value)
          ? value.map((item, index) => [String(index), item])
          : Object.entries(value);

        if (entries.length === 0) {
          return createJsonLeaf(
            key,
            Array.isArray(value) ? [] : {},
            depth,
          );
        }

        const wrapper = el("div", "json-node");
        wrapper.style.setProperty("--json-depth", depth);
        const toggle = el("button", "json-node-toggle");
        toggle.type = "button";
        setExpandedState(toggle, expanded);

        const arrow = el("span", "tree-arrow", "\u25B6");
        arrow.classList.toggle("open", expanded);
        toggle.appendChild(arrow);
        toggle.appendChild(el("span", "json-node-key", key));
        toggle.appendChild(el("span", "json-node-summary", formatJsonSummary(value)));
        wrapper.appendChild(toggle);

        const children = el("div", "json-node-children");
        children.classList.toggle("open", expanded);
        for (const [childKey, childValue] of entries) {
          children.appendChild(
            createJsonNode(childKey, childValue, depth + 1, {
              expanded: false,
            }),
          );
        }
        wrapper.appendChild(children);

        toggle.addEventListener("click", () => {
          const isOpen = !children.classList.contains("open");
          children.classList.toggle("open", isOpen);
          arrow.classList.toggle("open", isOpen);
          setExpandedState(toggle, isOpen);
        });

        return wrapper;
      }

      function toRawDocumentPayload(doc) {
        const payload = {};
        for (const [key, value] of Object.entries(doc || {})) {
          if (key === "kind" || key === "shareKey") continue;
          payload[key] = value;
        }
        return payload;
      }

      function renderDecisionSummary(mem) {
        const selected =
          mem.selected_option === undefined ||
          mem.selected_option === null ||
          mem.selected_option === ""
            ? ""
            : String(mem.selected_option);
        const reasoning =
          mem.reasoning === undefined ||
          mem.reasoning === null ||
          mem.reasoning === ""
            ? ""
            : String(mem.reasoning);
        const alternatives = Array.isArray(mem.alternatives)
          ? mem.alternatives.filter((alt) => alt && (alt.option || alt.why_not))
          : [];

        if (!selected && !reasoning && alternatives.length === 0) return null;

        const section = el("section", "card-decision");
        const header = el("div", "card-decision-header");
        header.appendChild(
          el("div", "card-decision-title", "Decision snapshot"),
        );

        let caption = "This captures the final choice for the decision.";
        if (selected && reasoning && alternatives.length > 0) {
          caption =
            "Chosen option first, then the reasoning and alternatives that were considered but not selected.";
        } else if (alternatives.length > 0) {
          caption =
            "These are the options that were considered, with the final choice shown first when available.";
        } else if (reasoning) {
          caption =
            "This captures the final choice and the reasoning behind it.";
        }
        header.appendChild(el("p", "card-decision-caption", caption));
        section.appendChild(header);

        if (selected) {
          const picked = el("div", "card-decision-picked");
          picked.appendChild(
            el("div", "card-decision-section-title", "Chosen option"),
          );
          picked.appendChild(el("div", "card-decision-picked-value", selected));
          section.appendChild(picked);
        }

        if (reasoning) {
          const reason = el("div", "card-decision-reason");
          reason.appendChild(
            el("div", "card-decision-section-title", "Why this choice"),
          );
          reason.appendChild(el("div", "card-detail-value", reasoning));
          section.appendChild(reason);
        }

        if (alternatives.length > 0) {
          const altSection = el("div", "card-decision-alternatives");
          altSection.appendChild(
            el("div", "card-decision-section-title", "Alternatives considered"),
          );
          altSection.appendChild(
            el(
              "p",
              "card-decision-caption",
              "Options evaluated but not adopted.",
            ),
          );

          const list = el("div", "card-decision-list");
          for (const alt of alternatives) {
            const item = el("article", "decision-alt-item");
            item.appendChild(
              el("div", "decision-alt-name", alt.option || "Alternative"),
            );

            if (alt.why_not) {
              const why = el("div", "decision-alt-why");
              why.appendChild(
                el("div", "decision-alt-label", "Not selected because"),
              );
              why.appendChild(
                el("div", "decision-alt-reason", String(alt.why_not)),
              );
              item.appendChild(why);
            }

            list.appendChild(item);
          }

          altSection.appendChild(list);
          section.appendChild(altSection);
        }

        return section;
      }

      function serializeSuggestion(value) {
        if (typeof value === "string") return value;
        try {
          return JSON.stringify(value, null, 2);
        } catch {
          return String(value);
        }
      }

      function renderSuggestions(container, suggestions) {
        if (!Array.isArray(suggestions) || suggestions.length === 0) return;
        const section = el("section", "suggestions-section");
        section.appendChild(el("h2", "suggestions-title", "Suggestions"));

        for (const item of suggestions) {
          const card = el("article", "suggestion-card");

          if (item && typeof item === "object" && !Array.isArray(item)) {
            const header = el("div", "suggestion-header");
            if (item.type)
              header.appendChild(el("span", "meta-chip", String(item.type)));
            if (item.severity) {
              header.appendChild(
                el("span", "meta-chip", String(item.severity)),
              );
            }
            if (header.childNodes.length > 0) {
              card.appendChild(header);
            }

            const message =
              item.message ??
              item.content ??
              item.title ??
              serializeSuggestion(item);
            card.appendChild(el("div", "suggestion-message", message));

            if (item.context) {
              card.appendChild(
                el("div", "suggestion-context", String(item.context)),
              );
            }
          } else {
            card.appendChild(
              el("div", "suggestion-message", serializeSuggestion(item)),
            );
          }

          section.appendChild(card);
        }

        container.appendChild(section);
      }

      function buildTreeIndexes(projects) {
        const { byId, byShareKey } = buildPermalinkIndexes(projects);
        state.fileIndexById = byId;
        state.fileIndexByShareKey = byShareKey;
      }

      function getTreeEntryByFileId(fileId) {
        return getIndexedTreeEntryByFileId(state.fileIndexById, fileId);
      }

      function getTreeEntryByShareKey(shareKey) {
        return getIndexedTreeEntryByShareKey(state.fileIndexByShareKey, shareKey);
      }

      function getShareKeyFromUrl() {
        return getShareKeyFromHref(window.location.href, SHARE_QUERY_PARAM);
      }

      function buildShareUrl(shareKey) {
        return buildPermalinkUrl(window.location.href, shareKey, SHARE_QUERY_PARAM);
      }

      function updateUrlForShareKey(shareKey, mode = "none") {
        if (mode === "none") return;
        const nextUrl = buildShareUrl(shareKey);
        if (nextUrl === window.location.href) return;
        const method = mode === "push" ? "pushState" : "replaceState";
        window.history[method]({}, "", nextUrl);
      }

      function invalidateActiveRequest() {
        state.activeRequestToken += 1;
        return state.activeRequestToken;
      }

      function renderContentNode(node) {
        const content = document.getElementById("content");
        content.innerHTML = "";
        content.appendChild(node);
      }

      function clearActiveSelection() {
        state.activeFileId = null;
        state.activeShareKey = null;
        updateActiveHighlight();
      }

      function setButtonText(button, text) {
        button.textContent = "";
        txt(button, text);
      }

      async function copyShareLink(shareKey, button) {
        const shareUrl = buildShareUrl(shareKey);
        const defaultLabel = button.dataset.defaultLabel || "Copy Link";
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(shareUrl);
            button.classList.add("copied");
            setButtonText(button, "Copied");
            if (state.shareFeedbackTimer) {
              clearTimeout(state.shareFeedbackTimer);
            }
            state.shareFeedbackTimer = window.setTimeout(() => {
              button.classList.remove("copied");
              setButtonText(button, defaultLabel);
              state.shareFeedbackTimer = null;
            }, 1400);
            return;
          }
        } catch (_) {}

        window.prompt("Copy this link", shareUrl);
      }

      function createCopyLinkButton(shareKey) {
        if (!shareKey) return null;
        const button = el("button", "btn btn-inline btn-copy", "Copy Link");
        button.type = "button";
        button.dataset.defaultLabel = "Copy Link";
        button.title = "Copy share link";
        button.addEventListener("click", async () => {
          await copyShareLink(shareKey, button);
        });
        return button;
      }

      function createDocumentHeader({ className, title, metaItems, shareKey }) {
        const header = el("div", className);
        const top = el("div", "document-header-top");
        const main = el("div", "document-header-main");
        main.appendChild(el("div", "session-id", title));
        top.appendChild(main);

        const copyBtn = createCopyLinkButton(shareKey);
        if (copyBtn) {
          const actions = el("div", "document-header-actions");
          actions.appendChild(copyBtn);
          top.appendChild(actions);
        }
        header.appendChild(top);

        const meta = el("div", "session-meta");
        for (const item of metaItems || []) {

      function openTreeAncestor(node) {
        if (!node) return;
        node.classList.add("open");
        if (node.classList.contains("tree-group-children")) {
          syncGroupChildrenInteractivity(node, true);
          const label = node.previousElementSibling;
          if (label && label.classList.contains("tree-group-label")) {
            setExpandedState(label, true);
            const arrow = label.querySelector(".tree-arrow");
            if (arrow) arrow.classList.add("open");
          }
          return;
        }
        if (node.classList.contains("tree-children")) {
          syncProjectChildrenInteractivity(node, true);
          const header = node.previousElementSibling;
          if (header && header.classList.contains("tree-project-header")) {
            setExpandedState(header, true);
            const arrow = header.querySelector(".tree-arrow");
            if (arrow) arrow.classList.add("open");
          }
        }
      }

      function expandAncestorsForFile(fileId) {
        const fileEl = document.querySelector(
          `.tree-file[data-file-id="${fileId}"]`,
        );
        if (!fileEl) return;
        let current = fileEl.parentElement;
        const sidebar = document.getElementById("sidebar");
        while (current && current !== sidebar) {
          if (
            current.classList.contains("tree-group-children") ||
            current.classList.contains("tree-children")
          ) {
            openTreeAncestor(current);
          }
          current = current.parentElement;
        }
      }

      function renderSharedNotFoundState(shareKey) {
        invalidateActiveRequest();
        clearActiveSelection();
        renderContentNode(
          renderInfoState({
            eyebrow: "Shared Link",
            title: "Shared memory not found",
            description:
              "The shared memory could not be resolved in the current root. Refresh the tree or open another memory from the sidebar.",
            tips: shareKey
              ? [`Share key: ${shareKey}`, "Use Refresh to rescan this root"]
              : ["Use Refresh to rescan this root"],
          }),
        );
      }

      async function restoreFromLocation({
        source = "url-init",
        historyMode = "replace",
      } = {}) {
        const resolution = resolveSharedEntry({
          href: window.location.href,
          byShareKey: state.fileIndexByShareKey,
          shareQueryParam: SHARE_QUERY_PARAM,
        });

        if (resolution.status === "empty") {
          invalidateActiveRequest();
          clearActiveSelection();
          renderContentNode(
            renderEmptyState("Select a memory file to preview"),
          );
          return;
        }

        if (resolution.status === "not-found") {
          renderSharedNotFoundState(resolution.shareKey);
          return;
        }

        await loadFile(resolution.entry.id, {
          historyMode,
          source,
          shareKey: resolution.shareKey,
        });
      }

      function getPreferredTheme() {
        const stored = localStorage.getItem(THEME_STORAGE_KEY);
        if (stored === "light" || stored === "dark") return stored;
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        state.theme = theme;
        updateThemeToggle(theme);
      }

      function updateThemeToggle(theme) {
        const label = document.getElementById("themeToggleLabel");
        const icon = document.getElementById("themeToggleIcon");
        const button = document.getElementById("themeToggleBtn");
        const nextTheme = theme === "dark" ? "light" : "dark";
        if (label) {
          label.textContent = nextTheme === "dark" ? "Dark mode" : "Light mode";
        }
        if (icon) {
          icon.innerHTML = THEME_ICONS[nextTheme];
        }
        if (button) {
          const actionLabel =
            nextTheme === "dark"
              ? "Switch to dark theme"
              : "Switch to light theme";
          button.setAttribute("aria-label", actionLabel);
          button.title = actionLabel;
        }
      }

      function setupThemeToggle() {
        applyTheme(getPreferredTheme());

        const media = window.matchMedia("(prefers-color-scheme: dark)");
        media.addEventListener("change", () => {
          if (!localStorage.getItem(THEME_STORAGE_KEY)) {
            applyTheme(getPreferredTheme());
          }
        });

        document
          .getElementById("themeToggleBtn")
          .addEventListener("click", () => {
            const nextTheme = state.theme === "dark" ? "light" : "dark";
            localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
            applyTheme(nextTheme);
          });
      }

      /* ============================================================
   Tree rendering
   ============================================================ */
      function renderTree(projects) {
        const sidebar = document.getElementById("sidebar");
        sidebar.innerHTML = "";

        if (!projects || projects.length === 0) {
          const empty = el("div", "tree-empty");
          txt(empty, "No memories/ directories found.\nCheck the root path.");
          sidebar.appendChild(empty);
          return;
        }

        for (const project of projects) {
          const projectEl = el("div", "tree-project");

          // project header
          const header = el("div", "tree-project-header");
          const arrow = el("span", "tree-arrow", "\u25B6");
          const nameSpan = el("span", "tree-project-name", project.displayName);
          nameSpan.title = project.projectId;
          header.appendChild(arrow);
          header.appendChild(nameSpan);
          setExpandedState(header, false);
          projectEl.appendChild(header);

          // children container
          const children = el("div", "tree-children");

          // memories section
          if (project.memories && project.memories.length > 0) {
            children.appendChild(el("div", "tree-section", "Memories"));
            for (const group of project.memories) {
              renderDateGroup(children, group);
            }
          }

          // archive section
          if (project.archive && project.archive.length > 0) {
            children.appendChild(el("div", "tree-section", "Archive"));
            for (const group of project.archive) {
              renderMonthGroup(children, group);
            }
          }

          // aggregates section
          if (project.aggregates && project.aggregates.length > 0) {
            children.appendChild(el("div", "tree-section", "Aggregates"));
            for (const agg of project.aggregates) {
              const fileEl = el("div", "tree-file", agg.name);
              fileEl.dataset.fileId = agg.id;
              fileEl.dataset.shareKey = agg.shareKey || "";
              makeInteractive(
                fileEl,
                () =>
                  loadFile(agg.id, {
                    historyMode: "push",
                    source: "tree",
                    shareKey: agg.shareKey || null,
                  }),
                {
                  enabled: false,
                },
              );
              children.appendChild(fileEl);
            }
          }

          projectEl.appendChild(children);
          syncProjectChildrenInteractivity(children, false);

          // toggle
          makeInteractive(header, () => {
            const isOpen = !children.classList.contains("open");
            arrow.classList.toggle("open", isOpen);
            children.classList.toggle("open", isOpen);
            setExpandedState(header, isOpen);
            syncProjectChildrenInteractivity(children, isOpen);
          });

          sidebar.appendChild(projectEl);
        }

        // auto-expand first project
        const firstArrow = sidebar.querySelector(".tree-arrow");
        const firstChildren = sidebar.querySelector(".tree-children");
        if (firstArrow && firstChildren) {
          firstArrow.classList.add("open");
          firstChildren.classList.add("open");
          const firstHeader = sidebar.querySelector(".tree-project-header");
          if (firstHeader) setExpandedState(firstHeader, true);
          syncProjectChildrenInteractivity(firstChildren, true);
        }
      }

      /* ============================================================
   File loading & Memory rendering
   ============================================================ */
      async function loadFile(fileId, options = {}) {
        const { historyMode = "push", shareKey: providedShareKey = null } =
          options;
        if (state.searchMode) {
          exitSearchMode();
        }
        const requestToken = invalidateActiveRequest();
        const treeEntry = getTreeEntryByFileId(fileId);
        const resolvedShareKey =
          providedShareKey || treeEntry?.shareKey || state.activeShareKey;
        state.activeFileId = fileId;
        state.activeShareKey = resolvedShareKey;
        if (resolvedShareKey) {
          updateUrlForShareKey(resolvedShareKey, historyMode);
        }
        expandAncestorsForFile(fileId);
        updateActiveHighlight();

        const content = document.getElementById("content");
        content.innerHTML = "";
        const loading = el("div", "content-loading");
        loading.appendChild(el("div", "spinner"));
        txt(loading, "Loading...");
        content.appendChild(loading);

        try {
          const doc = await apiGet(`/api/memory/${fileId}`);
          if (requestToken !== state.activeRequestToken) return;
          if (doc.shareKey) {
            state.activeShareKey = doc.shareKey;
            updateUrlForShareKey(
              doc.shareKey,
              historyMode === "push" ? "replace" : historyMode,
            );
          }
          content.innerHTML = "";
          if (doc.kind === "aggregate") {
            renderAggregate(content, doc);
          } else if (doc.kind === "error") {
            content.appendChild(
              renderInfoState({
                eyebrow: "Load Error",
                title: "Unable to open this memory file",
                description:
                  doc.error || "The memory document returned an error.",
                tips: [
                  "Try refreshing the tree",
                  "Check whether the file still exists",
                ],
              }),
            );
          } else {
            renderSession(content, doc);
          }
        } catch (err) {
          if (requestToken !== state.activeRequestToken) return;
          content.innerHTML = "";
          content.appendChild(
            renderInfoState({
              eyebrow: "Request Failed",
              title: "Failed to load memory content",
              description: err.message,
              tips: ["Refresh and retry", "Verify the memory API is available"],
            }),
          );
        }
      }

      function renderSession(container, doc) {
        const header = createDocumentHeader({
          className: "session-header",
          title: doc.session_id || "Unknown Session",
          metaItems: [
            doc.timestamp || null,
            doc.last_updated ? `Updated ${doc.last_updated}` : null,
            doc.extraction_count
              ? `Extraction #${formatNumber(doc.extraction_count)}`
              : null,
          ],
          shareKey: doc.shareKey || state.activeShareKey,
        });
        container.appendChild(header);
        container.appendChild(renderRawJsonSection(doc));

        const memories = Array.isArray(doc.memories) ? doc.memories : [];
        for (let i = 0; i < memories.length; i++) {
          const card = renderMemoryCard(memories[i], i);
          card.style.animationDelay = `${i * 0.05}s`;
          card.id = `memory-${i}`;
          container.appendChild(card);
        }

        renderSuggestions(container, doc.suggestions);
      }

      function renderAggregate(container, doc) {
        const header = createDocumentHeader({
          className: "aggregate-header",
          title: `Aggregate: ${doc.month || "Unknown"}`,
          metaItems: [
            doc.generated_at ? `Generated ${doc.generated_at}` : null,
          ],
          shareKey: doc.shareKey || state.activeShareKey,
        });

        if (doc.stats) {
          const statsRow = el("div", "aggregate-stats");
          for (const [key, val] of Object.entries(doc.stats)) {
            const card = el("div", "stat-card");
            card.appendChild(el("div", "stat-card-value", formatNumber(val)));
            card.appendChild(
              el("div", "stat-card-label", key.replace(/_/g, " ")),
            );
            statsRow.appendChild(card);
          }
          header.appendChild(statsRow);
        }
        container.appendChild(header);
        container.appendChild(renderRawJsonSection(doc));

        const memories = Array.isArray(doc.deduped_memories)
          ? doc.deduped_memories
          : [];
        for (let i = 0; i < memories.length; i++) {
          const card = renderMemoryCard(memories[i], i);
          card.style.animationDelay = `${i * 0.05}s`;
          container.appendChild(card);
        }
      }

      /* ============================================================
   Memory Card
   ============================================================ */
      const TYPE_COLORS = {
        decision: "var(--type-decision)",
        insight: "var(--type-insight)",
        confidence: "var(--type-confidence)",
        pattern_seed: "var(--type-pattern_seed)",
        commitment: "var(--type-commitment)",
        learning: "var(--type-learning)",
        correction: "var(--type-correction)",
        cross_agent: "var(--type-cross_agent)",
        workflow_note: "var(--type-workflow_note)",
        gap: "var(--type-gap)",
      };

      function renderMemoryCard(mem, index) {
        const card = el("div", "memory-card");

        const top = el("div", "card-top");
        const badge = el(
          "span",
          "type-badge",
          (mem.type || "unknown").replace(/_/g, " "),
        );
        const color = TYPE_COLORS[mem.type] || "var(--text-muted)";
        badge.style.background = color;
        badge.style.color = "#fff";
        top.appendChild(badge);
        if (mem.category) {
          top.appendChild(el("span", "category-badge", mem.category));
        }
        top.appendChild(
          el("span", "card-title", mem.title || `Memory ${index + 1}`),
        );
        card.appendChild(top);

        if (mem.content) {
          card.appendChild(el("div", "card-content", mem.content));
        }

        if (mem.type === "decision") {
          const decisionSummary = renderDecisionSummary(mem);
          if (decisionSummary) {
            card.appendChild(decisionSummary);
          }
        } else if (mem.reasoning) {
          card.appendChild(el("div", "card-reasoning", mem.reasoning));
        }

        if (typeof mem.confidence_score === "number") {
          const row = el("div", "confidence-row");
          const label = document.createElement("strong");
          txt(label, "Confidence");
          row.appendChild(label);
          const barBg = el("div", "confidence-bar-bg");
          const barFill = el("div", "confidence-bar-fill");
          const score = mem.confidence_score;
          const confColor =
            score < 60
              ? "var(--conf-low)"
              : score < 80
                ? "var(--conf-mid)"
                : "var(--conf-high)";
          barFill.style.background = confColor;
          requestAnimationFrame(() => {
            barFill.style.width = `${score}%`;
          });
          barBg.appendChild(barFill);
          row.appendChild(barBg);
          txt(row, `${formatNumber(score)}%`);
          card.appendChild(row);
        }

        if (
          Array.isArray(mem.related_entities) &&
          mem.related_entities.length > 0
        ) {
          const entities = mem.related_entities.map(
            (ent) => `${ent.type}: ${ent.raw || ent.slug || ""}`,
          );
          const tags = renderTagGroup("Related entities", entities);
          if (tags) card.appendChild(tags);
        }

        if (
          Array.isArray(mem.tools_mentioned) &&
          mem.tools_mentioned.length > 0
        ) {
          const tags = renderTagGroup("Tools", mem.tools_mentioned);
          if (tags) card.appendChild(tags);
        }

        if (Array.isArray(mem.target_agents) && mem.target_agents.length > 0) {
          const tags = renderTagGroup("Target agents", mem.target_agents);
          if (tags) card.appendChild(tags);
        }

        if (
          Array.isArray(mem.urls_mentioned) &&
          mem.urls_mentioned.length > 0
        ) {
          const urlDiv = el("div", "card-urls");
          for (const u of mem.urls_mentioned) {
            if (/^https?:\/\//i.test(u)) {
              const a = document.createElement("a");
              a.href = u;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              txt(a, u);
              urlDiv.appendChild(a);
              urlDiv.appendChild(document.createElement("br"));
            } else {
              urlDiv.appendChild(el("span", "", u));
              urlDiv.appendChild(document.createElement("br"));
            }
          }
          card.appendChild(urlDiv);
        }

        if (mem.source_chunk) {
          const toggle = el("button", "source-toggle");
          toggle.type = "button";
          setExpandedState(toggle, false);
          const toggleArrow = el("span", "tree-arrow", "\u25B6");
          toggle.appendChild(toggleArrow);
          txt(toggle, " Source conversation");
          card.appendChild(toggle);

          const chunkDiv = el("div", "source-chunk");
          renderSourceChunk(chunkDiv, mem.source_chunk);
          card.appendChild(chunkDiv);

          toggle.addEventListener("click", () => {
            const isOpen = !chunkDiv.classList.contains("open");
            toggleArrow.classList.toggle("open", isOpen);
            chunkDiv.classList.toggle("open", isOpen);
            setExpandedState(toggle, isOpen);
          });
        }

        return card;
      }

      function renderSourceChunk(container, text) {
        const lines = text.split("\n");
        for (const line of lines) {
          const p = document.createElement("p");
          if (line.startsWith("**User:**")) {
            const label = el("span", "msg-user", "User: ");
            p.appendChild(label);
            txt(p, line.replace("**User:**", "").trim());
          } else if (line.startsWith("**Assistant:**")) {
            const label = el("span", "msg-assistant", "Assistant: ");
            p.appendChild(label);
            txt(p, line.replace("**Assistant:**", "").trim());
          } else {
            txt(p, line);
          }
          container.appendChild(p);
        }
      }

      /* ============================================================
   Search
   ============================================================ */
      let searchTimer = null;

      function setupSearch() {
        const input = document.getElementById("searchInput");
        input.addEventListener("input", () => {
          clearTimeout(searchTimer);
          const q = input.value.trim();
          if (!q) {
            exitSearchMode();
            if (state.activeFileId != null) {
              loadFile(state.activeFileId, {
                historyMode: "none",
                source: "search-exit",
                shareKey: state.activeShareKey,
              });
            } else {
              renderContentNode(
                renderEmptyState("Select a memory file to preview"),
              );
            }
            return;
          }
          searchTimer = setTimeout(() => doSearch(q), 300);
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            input.value = "";
            exitSearchMode();
            if (state.activeFileId != null) {
              loadFile(state.activeFileId, {
                historyMode: "none",
                source: "search-exit",
                shareKey: state.activeShareKey,
              });
            } else {
              renderContentNode(
                renderEmptyState("Select a memory file to preview"),
              );
            }
          }
        });
      }

      async function doSearch(query) {
        // abort previous
        if (state.searchAbort) state.searchAbort.abort();
        const controller = new AbortController();
        state.searchAbort = controller;
        invalidateActiveRequest();

        state.searchMode = true;
        const content = document.getElementById("content");
        content.innerHTML = "";
        const loading = el("div", "content-loading");
        loading.appendChild(el("div", "spinner"));
        txt(loading, "Searching...");
        content.appendChild(loading);

        try {
          const res = await fetch(
            `/api/search?q=${encodeURIComponent(query)}&limit=50`,
            {
              signal: controller.signal,
            },
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          content.innerHTML = "";
          if (data.results.length === 0) {
            content.appendChild(
              renderInfoState({
                eyebrow: "Search",
                title: "No matching memories found",
                description:
                  "Try a broader keyword, search for a tool name, or open a session from the sidebar to inspect the full memory trail.",
                tips: [
                  "Search title keywords",
                  "Search entity names",
                  "Search tool names",
                ],
              }),
            );
            return;
          }

          content.appendChild(
            el(
              "div",
              "search-results-header",
              `${data.total} result${data.total !== 1 ? "s" : ""} found`,
            ),
          );

          for (const hit of data.results) {
            const hitEl = el("div", "search-hit");
            hitEl.appendChild(
              el(
                "div",
                "search-hit-project",
                `${hit.displayName} / ${hit.fileName}`,
              ),
            );
            hitEl.appendChild(el("div", "search-hit-title", hit.title));

            // safe highlight
            const snippetEl = el("div", "search-hit-snippet");
            highlightText(snippetEl, hit.snippet, query);
            hitEl.appendChild(snippetEl);

            makeInteractive(hitEl, () => {
              const shareKey =
                getTreeEntryByFileId(hit.fileId)?.shareKey || null;
              loadFile(hit.fileId, {
                historyMode: "push",
                source: "search",
                shareKey,
              }).then(() => {
                const target = document.getElementById(
                  `memory-${hit.memoryIndex}`,
                );
                if (target)
                  target.scrollIntoView({
                    behavior: "smooth",
                    block: "center",
                  });
              });
            });
            content.appendChild(hitEl);
          }
        } catch (err) {
          if (err.name === "AbortError") return;
          content.innerHTML = "";
          content.appendChild(
            renderInfoState({
              eyebrow: "Search Error",
              title: "Search request failed",
              description: err.message,
              tips: [
                "Retry with the same query",
                "Check whether the search endpoint is reachable",
              ],
            }),
          );
        }
      }

      function highlightText(container, text, query) {
        if (!text || !query) {
          txt(container, text || "");
          return;
        }
        const lower = text.toLowerCase();
        const qLower = query.toLowerCase();
        let lastIdx = 0;
        let idx = lower.indexOf(qLower);

        while (idx !== -1) {
          // text before match
          if (idx > lastIdx) txt(container, text.slice(lastIdx, idx));
          // match
          const markEl = document.createElement("mark");
          txt(markEl, text.slice(idx, idx + query.length));
          container.appendChild(markEl);
          lastIdx = idx + query.length;
          idx = lower.indexOf(qLower, lastIdx);
        }
        // remaining text
        if (lastIdx < text.length) txt(container, text.slice(lastIdx));
      }

      function exitSearchMode() {
        if (!state.searchMode) return;
        state.searchMode = false;
        const input = document.getElementById("searchInput");
        if (input) input.value = "";
        if (state.searchAbort) {
          state.searchAbort.abort();
          state.searchAbort = null;
        }
      }

      function updateActiveHighlight() {
        document
          .querySelectorAll(".tree-file.active")
          .forEach((e) => e.classList.remove("active"));
        if (state.activeFileId != null) {
          expandAncestorsForFile(state.activeFileId);
          const active = document.querySelector(
            `.tree-file[data-file-id="${state.activeFileId}"]`,
          );
          if (active) {
            active.classList.add("active");
            active.scrollIntoView({ block: "nearest" });
          }
        }
      }

      /* ============================================================
   Init
   ============================================================ */
      async function init() {
        setupThemeToggle();
        setupSearch();

        window.addEventListener("popstate", async () => {
          await restoreFromLocation({
            source: "popstate",
            historyMode: "none",
          });
        });

        document
          .getElementById("refreshBtn")
          .addEventListener("click", async () => {
            invalidateActiveRequest();
            await apiPost("/api/refresh");
            state.tree = null;
            await loadTree();
            await restoreFromLocation({
              source: "refresh-restore",
              historyMode: "replace",
            });
          });

        const initialEmpty = document.getElementById("initialEmptyState");
        if (initialEmpty) {
          initialEmpty.replaceWith(
            renderEmptyState("Select a memory file to preview"),
          );
        }

        await loadTree();
        await restoreFromLocation({
          source: "url-init",
          historyMode: "replace",
        });
      }

      async function loadTree() {
        const sidebar = document.getElementById("sidebar");
        state.fileIndexById = new Map();
        state.fileIndexByShareKey = new Map();
        sidebar.innerHTML = "";
        const loading = el("div", "content-loading");
        loading.appendChild(el("div", "spinner"));
        txt(loading, "Scanning...");
        sidebar.appendChild(loading);

        try {
          const data = await apiGet("/api/tree");
          state.tree = data.projects;
          buildTreeIndexes(data.projects);
          renderTree(data.projects);
        } catch (err) {
          sidebar.innerHTML = "";
          const empty = el("div", "tree-empty");
          txt(empty, `Error loading tree: ${err.message}`);
          sidebar.appendChild(empty);
        }
      }

      /* ============================================================
   Keyboard navigation
   ============================================================ */
      document.addEventListener("keydown", (e) => {
        // Ctrl/Cmd + K to focus search
        if ((e.ctrlKey || e.metaKey) && e.key === "k") {
          e.preventDefault();
          document.getElementById("searchInput").focus();
        }
      });

      init();
    </script>
  </body>
</html>
